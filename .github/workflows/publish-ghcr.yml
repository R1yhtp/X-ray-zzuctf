name: Build and publish GHCR image

on:
  workflow_dispatch:
    inputs:
      image_path:
        description: '镜像路径（账号后面的部分）'
        required: true
        default: 'zzu2026/x-ray'
        type: string
      image_tag:
        description: '版本标签'
        required: true
        default: '1.0'
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  group: x-ray-ghcr-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, solve-test, and push image
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Resolve image reference
        id: image
        env:
          INPUT_IMAGE_PATH: ${{ inputs.image_path }}
          INPUT_IMAGE_TAG: ${{ inputs.image_tag }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/image_reference.py

      - name: Build linux/amd64 image
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label 'org.opencontainers.image.description=X-ray GZCTF hardware waveform Misc challenge' \
            --label 'org.opencontainers.image.licenses=MIT' \
            --tag "$IMAGE_URI" .

      - name: Run image and recover its test flag
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/smoke_image.py --image "$IMAGE_URI"

      - name: Log in and push to GHCR
        env:
          IMAGE_URI: ${{ steps.image.outputs.uri }}
          GHCR_WORKFLOW_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_WORKFLOW_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE_URI"
          docker buildx imagetools inspect "$IMAGE_URI"
          {
            printf '## 镜像构建、通关验证及推送成功\n\n'
            printf 'GZCTF 容器镜像字段填写：\n\n```text\n%s\n```\n\n' "$IMAGE_URI"
            printf '| 配置 | 值 |\n|---|---|\n| 服务端口 | 8000 / TCP |\n| 动态 flag 模板 | zzuctf{[GUID]} |\n\n'
            printf '首次发布后，在 GitHub 个人主页 → Packages → 对应镜像 → Package settings → Change visibility 设置 Public，或给 GZCTF 配置私有仓库拉取凭据。\n\n'
            printf '源码仓库可以保持 Private；镜像可单独设置 Public。\n'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Log out of registry
        if: always()
        run: docker logout ghcr.io || true
